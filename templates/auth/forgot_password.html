{% extends "base.html" %}

{% block title %}Forgot Password - Genetic Purity AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="glass-card p-8 relative overflow-hidden">
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-center mb-4">
                <i class="fa-solid fa-mobile-screen-button text-2xl text-teal-400"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Reset Password</h2>
            <p class="text-slate-400 text-xs mt-1">Enter your registered mobile number to receive a 6-digit SMS OTP.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div>
                <label for="mobileNumber" class="form-label">Registered Mobile Number</label>
                <input type="tel" id="mobileNumber" name="mobileNumber" value="{{ mobile or '' }}" required class="form-input" placeholder="+1234567890" autofocus>
            </div>

            <button type="submit" class="btn-primary w-full py-3 text-sm font-semibold shadow-lg shadow-emerald-500/25">
                <i class="fa-solid fa-paper-plane mr-2"></i> Send OTP via SMS
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
            Remembered your password? 
            <a href="{{ url_for('auth.login') }}" class="text-emerald-400 font-semibold hover:underline">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
