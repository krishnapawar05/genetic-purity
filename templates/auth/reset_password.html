{% extends "base.html" %}

{% block title %}Set New Password - Genetic Purity AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="glass-card p-8 relative overflow-hidden">
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mb-4">
                <i class="fa-solid fa-key text-2xl text-emerald-400"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Create New Password</h2>
            <p class="text-slate-400 text-xs mt-1">Your identity has been verified. Enter a new strong password below.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password') }}" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div>
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" id="newPassword" name="newPassword" required class="form-input" placeholder="Min. 8 chars, uppercase, lowercase, numbers">
            </div>

            <div>
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required class="form-input" placeholder="Re-enter new password">
            </div>

            <button type="submit" class="btn-primary w-full py-3 text-sm font-semibold shadow-lg shadow-emerald-500/25">
                <i class="fa-solid fa-lock mr-2"></i> Update Password & Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
